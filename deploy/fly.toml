# Fly configuration. Deploy from the repository root so the build context is
# the whole repo:
#
#   fly deploy -c deploy/fly.toml
#
# ONE MACHINE. SQLite in WAL mode is single-writer; two machines writing the
# same volume silently corrupt state, and the order log is the only source of
# truth for every metric in the project. `min_machines_running = 1` and
# `auto_stop_machines = false` keep one machine up; the ceiling is set outside
# this file with `fly scale count 1` (there is no max_machines_running key) and
# must be re-checked after any scaling change.

app = "cafe-flow-demo"
primary_region = "ord"           # near campus; set to your own region

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  CAFE_ENV = "demo"              # dev | demo | pilot — pilot refuses simulated orders
  DATA_DIR = "/data"
  PORT = "8080"
  CAFE_SSE_HEARTBEAT_S = "15"    # must stay below the proxy idle timeout

[[mounts]]
  source = "cafe_data"           # fly volumes create cafe_data --size 1
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # A stopped machine is a dead SSE stream and a dark bar display.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  # SSE holds one connection open per open view for the whole shift, so the
  # limits count connections rather than requests.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  # Peak is ~40 orders in 10 minutes. The constraint is reliability, not
  # throughput; do not scale this up to solve a reliability problem.
