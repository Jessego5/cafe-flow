name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  web:
    name: build the views
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  image:
    name: build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  drift:
    # M9: the app's event log must produce the same metrics as the in-process
    # run for the same scenario. If they disagree the app and the core have
    # drifted, and that is a bug in app/, not a tolerance to widen, so this
    # gates the deploy rather than reporting.
    name: app/core drift check
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: replay a simulated day at the app and compare the two logs
        # Unpaced and structural: prices, bottleneck costs, item lists, state
        # paths and counts do not depend on how fast the replay ran, so this is
        # seconds rather than the eight minutes a paced day would take.
        run: python -m sim.client --drift-check
      - name: a slot cannot be overbooked under concurrency
        run: |
          CAFE_PARAMS="params/base.yaml:params/experiments/slots_check.yaml" \
            python -m sim.client --concurrency

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [test, web, image, drift]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-fly          # one machine, so one deploy at a time
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: deploy on green
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::notice::FLY_API_TOKEN is not set; skipping deploy"
            exit 0
          fi
          flyctl deploy -c deploy/fly.toml --remote-only
