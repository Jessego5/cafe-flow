# Counterfactual: the same pre-made food, on a station that heats one at a time.
#
# Observation settled the first two of these and refuted the third, which is why
# this file is an arm rather than a hypothesis:
#
#   1. The cycle is short. Heating a wrapped sandwich is around a minute,
#      against the three to five the config had for a press.
#   2. There is nothing to assemble. Someone built it earlier; the barista
#      takes it out, unwraps it and hands it over.
#   3. IT HOLDS ONE. This is the counterfactual. The cafe's oven holds three,
#      and `params/observed.yaml` carries that. A station holding one removes
#      the batching this project had expected to find the saving in, so the arm
#      exists to price what that would have cost.
#
# The station is still called panini_press, which is a misnomer either way. It
# stays because renaming it is a config change with no result attached.

meta:
  scenario: microwave
  source: assumed

stations:
  panini_press:
    run_s: 60
    batch_size: 1
    source_of: { run_s: assumed, batch_size: assumed }

menu:
  bacon_egg_cheese_bagel:   { assembly_s: 15 }
  sausage_egg_cheese:       { assembly_s: 15 }
  vegan_sausage_egg_cheese: { assembly_s: 15 }
  italian_herb_chicken:     { assembly_s: 20 }
  mona_lisa:                { assembly_s: 20 }
  monterey_turkey:          { assembly_s: 20 }
