# Maven Roasters, Hell's Kitchen - built from a transaction log.
#
# 46,844 orders over 181 days, from the Maven Analytics "Coffee Shop Sales"
# dataset. The shape of the day, the opening hours, the item mix and the prices
# are read out of that file rather than invented.
#
# IT IS A FICTITIOUS BUSINESS. Maven generates these for teaching, so the data
# is realistic in shape and is not a record of anything that happened anywhere.
# That is why it is marked synthetic rather than observed: a log from a real
# till would earn the stronger word; this does not.
#
# What no sales log can supply, however many rows it has: service times, which
# station does the work, staffing, and - the important one - balking. A list of
# people who bought something is structurally blind to everyone who looked at
# the queue and left.
#
# The station plans below are a judgement about how a bar works, not a fact in
# the data, and are marked assumed accordingly.
#
#   python -m analysis.demand "Coffee Shop Sales.xlsx" --location "Hell's Kitchen"
#   https://mavenanalytics.io/data-playground/coffee-shop-sales

