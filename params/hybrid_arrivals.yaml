# Fitted by sim/fit_hybrid.py: the room schedule's shape, the counted queue's
# level. rate(t) = capture(t) * released(t) + background.
#
# Three numbers were fitted against 12 counted bins, and the registrar's
# timetable carries everything else. The free-rate fit in fitted_arrivals.yaml
# uses twelve for the same twelve bins, which leaves it no way to tell a real
# trough from a bin somebody happened to glance at twice.
#
#   capture at noon        0.040   of a released class
#   afternoon decay        0.10/h  a 15:45 class is going home, not to lunch
#   background              24/h  everyone not walking out of a class here
#
# The background is the finding. base.yaml assumed 8 an hour; the fit wants
# 24, so most of the demand between classes is not this building's
# students at all -- which is also why the timetable alone emptied the cafe at
# half past one and the counted queue did not.
#
# Mean absolute error 1.04 people across the counted bins.
#
# The morning is confirmed out of sample. Nothing here was fitted to it -- the
# queue was only counted from 10:20 -- yet 20 orders were later counted on a
# Thursday in 09:15-09:35 against this model's 20.1 for that day, where the free-rate fit predicts 7.3
# and never once reached 20 in twenty simulated days. See
# observations/morning-order-count.txt.

arrivals:
  model: profile
  class_blocks: null
  capture_rate: 1.0
  background_per_hour: 0.0
  profile:
    bin_minutes: 30.0
    rate_per_hour:
