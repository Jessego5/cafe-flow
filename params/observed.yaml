# Ground Truth, from observation in the cafe. 49 queue readings between 10:20
# and 15:44, plus notes taken alongside them, plus the menu boards photographed
# there.
#
# What was seen rather than guessed: the hours, the staffing, what heats the
# food and how many it holds, that the till is a dedicated station, and the
# shape of the queue. capture_rate is fitted to reproduce the queue depth.
#
# One partial: the till person never makes drinks, so the register should not
# draw on the barista pool at all. The engine always takes a barista for the
# register phase, so capacity 1 is as close as the config can get: it stops
# the register scaling with the crew, but still spends one barista's time.
#
# Two things the boards say that this file cannot hold. The soups are priced by
# size, cup 3.99 and bowl 4.39, and `variants` here means the hot-or-iced serve
# choice drawn from mix.serve, a second axis would need a model, not a value,
# so only the cup price is carried. Likewise the paid extras: whipped cream
# +0.60, syrup +0.65, sauce +0.85, alternative milk at no charge, and on the
# food board an extra salad topping +1.00, a premium topping +1.75, a Vienna
# roll +1.00. Nothing here models a paid modifier.

# The cafe's own name. base.yaml carries "Ground Truth" marked assumed, a
# placeholder for the scenario, never something anyone at the counter says.
cafe:
  name: Morgridge Coffee
  source_of: { name: observed }

meta:
  scenario: ground_truth_observed
  sim_start: "07:30"
  sim_end: "16:30"
  source_of: { sim_start: observed, sim_end: observed }
  source: assumed

stations:
  # a high-speed oven, and it holds three
  panini_press:
    run_s: 45
    batch_size: 3
    source_of: { run_s: published, batch_size: observed }
  register:
    capacity: 1
    # 70 laps at the till, one per customer leaving it, with the item count and
    # whether there was food. Fitted as base + per_item*items + food*is_food:
    #
    #     base_s        17.3  +/- 3.6
    #     per_item_s     8.5  +/- 3.1
    #     food_s        13.2  +/- 3.2      R^2 0.84, residual sd 4.5s
    #
    # Fitting without the food term blames the item count for both and returns
    # per_item_s = 17.8, because food nearly always comes with a drink and the
    # two are collinear. Separating them recovers exactly the eight seconds an
    # extra item was recalled to cost, and finds a thirteen-second premium on
    # ringing up a sandwich that nothing in the model had a place for.
    #
    # The published figure this replaces was 40 + 3n: a large fixed cost and
    # almost no sensitivity to basket size. The till is the other way round.
    base_s: 17.3
    per_item_s: 8.5
    food_s: 13.2
    source_of: { capacity: observed, base_s: observed, per_item_s: observed,
                 food_s: observed }

staffing:
  - { from: "07:30", to: "10:00", baristas: 3, source: observed }
  - { from: "10:00", to: "13:00", baristas: 5, source: observed }
  - { from: "13:00", to: "16:30", baristas: 4, source: observed }

arrivals:
  # Fitted so the simulated queue reproduces the 3.7 people seen on average
  # across 49 readings. The balk count agrees at the same rate without being
  # fitted to, which is the only check here that means anything.
  capture_rate: 0.065
  source_of: { capture_rate: fitted }

customers:
  # One person left in all the watching, at a line of eleven. The assumed
  # seven-minute median had the cafe shedding a third of its demand, which is
  # not what happens here: people wait.
  #
  # This is raised to the least it can be and still be consistent with that one
  # balk. `time_budget_min` was left alone deliberately, the model still lost
  # far more customers than were seen leaving, and turning a second patience
  # knob to bury that would have been tuning the fit rather than fixing the
  # model.
  #
  # Fixing the model is what happened instead. The budget was being spent after
  # the register, so anyone whose drink took too long was recorded as having
  # walked out on an order they had already paid for. It is now spent in the
  # line, before the till, and abandonment falls to about one a day on its own,
  # with the number itself never touched.
  balk_tolerance_min: { dist: lognormal, median: 20.0, sigma: 0.5 }
  source_of: { balk_tolerance_min: fitted }

# ---------------------------------------------------------------------------
# menu
#
# Read off the two boards photographed in the cafe. Calories are the board's own
# figures for the medium size, and the board's footnote applies: milk drinks
# are calculated with 2% milk, the Black Tie excepted. The food board posts no
# calories at all, so the sandwiches, salads and soups have none here.
#
# The prices already in base.yaml were read from an earlier photograph and all
# still agree, so nothing is restated except the Caesar salad, whose price sat
# at the edge of that frame and was carried as a guess. It was right.
# ---------------------------------------------------------------------------
menu:
  drip_coffee:      { calories: 0,   source_of: { calories: observed } }
  espresso:         { calories: 10,  source_of: { calories: observed } }
  americano:        { calories: 25,  source_of: { calories: observed } }
  cappuccino:       { calories: 140, source_of: { calories: observed } }
  latte:            { calories: 220, source_of: { calories: observed } }
  vanilla_latte:    { calories: 320, source_of: { calories: observed } }
  caramel_macchiato: { calories: 350, source_of: { calories: observed } }
  mocha:            { calories: 410, source_of: { calories: observed } }
  white_chocolate_mocha: { calories: 400, source_of: { calories: observed } }

  cold_brew:        { calories: 0,   source_of: { calories: observed } }
  cold_brew_oat_latte: { calories: 230, source_of: { calories: observed } }
  black_tie:        { calories: 190, source_of: { calories: observed } }

  brewed_tea:       { calories: 0,   source_of: { calories: observed } }
  matcha_latte:     { calories: 300, source_of: { calories: observed } }
  chai_latte:       { calories: 240, source_of: { calories: observed } }
  iced_tea:         { calories: 0,   source_of: { calories: observed } }
  sparkling_grapefruit_cold_brew: { calories: 120, source_of: { calories: observed } }
  sparkling_passion_fruit_black_tea: { calories: 130, source_of: { calories: observed } }
  sparkling_lemonade: { calories: 130, source_of: { calories: observed } }

  cocoa:            { calories: 530, source_of: { calories: observed } }

  caesar_salad:     { price_cents: 1100, source_of: { price_cents: observed } }

# ---------------------------------------------------------------------------
# what people buy, from the same 70 laps
#
#     drink only   42/70  60.0%      (base.yaml's fitted guess: 64.5%)
#     food + drink 23/70  32.9%      (26.0%)
#     food alone    5/70   7.1%      ( 9.5%)
#     basket mean          1.386     (1.26)
#
# alone is read straight off; rate is what makes the rest come out, since a
# food-and-drink order is one that did not go alone and then attached:
# 0.329 = (1 - 0.071) * rate.
#
# One known gap. Four of the seventy were two drinks and no food, and one was
# three items; the attachment model can only add food, so it cannot produce
# either. That is 7% of orders whose second item the model will miss, and it is
# why the modelled basket mean lands at 1.33 against the 1.386 counted.
# ---------------------------------------------------------------------------
mix:
  # Kept because the schema requires it; `basket` below supersedes it.
  attach: { rate: 0.354, alone: 0.071, source: observed }

  # Straight off the 70 laps. The attach model could not produce two drinks or
  # three items -- 7% of what was counted -- and had one food rate for every
  # basket, where the counted ones say bigger baskets are bigger because of the
  # food.
  #
  #     size 1   44 orders  62.9%   of which 11.4% had food
  #     size 2   25 orders  35.7%                88.0%
  #     size 3    1 order    1.4%               100.0%
  basket:
    size: [0.629, 0.357, 0.014]
    food: [0.114, 0.880, 1.000]
    source: observed
