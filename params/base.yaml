# Ground Truth (a Wisconsin Union cafe), pouring Peet's Coffee.
#
# Provenance (ground rule 3). `source` on a mapping applies to everything
# beneath it; `source_of` overrides individual keys in that same mapping.
#
#   observed   read off the menu boards photographed in the cafe
#   published  a conventional figure from an industry or vendor source, cited
#              at the parameter
#   assumed    still a guess
#
# Service times are published figures where a conventional one exists. What no
# source can supply is this cafe's own demand: the mix, the hot/iced split, the
# capture rate and the staffing plan are all still assumed.
#
# Sources
#   espresso extraction 25-30s      Specialty Coffee Association standard
#     https://www.espressocoffeeshopusa.com/blog/post/26-espresso-extraction-time-perfect-25-30-second-shot
#   steaming a pitcher 30-45s       home-barista.com / Breville barista guides
#     https://www.home-barista.com/espresso-guide-frothing-milk.html
#   panini press 3-5 min, 1-2 at a time, 10-15 sandwiches/hour
#     https://www.gofoodservice.com/guides/panini-sandwich-grill-buying-guide
#   register 40s per transaction plus 3s per item
#     https://www.possolutions.com.au/blog/how-fast-is-your-pos-system-and-what-to-do-about-it
#   Peet's medium (16oz) latte is a double: 140mg caffeine at 70mg a shot
#     https://www.caffeineinformer.com/caffeine-content/peets-latte

meta:
  scenario: ground_truth_assumed
  seed: 42
  sim_start: "07:00"
  sim_end: "15:00"
  source: assumed

cafe:
  name: Ground Truth
  timezone: America/Chicago
  source: assumed

# ---------------------------------------------------------------------------
# stations
#
# Observed from the photographs: espresso bar, batch-brew urns and taps, a
# panini press, and a food counter for salads and soups. There is no blender
# (no blended drinks anywhere on the board) and no oven.
#
# NOT observed, and the three that matter most: how many steam wands and group
# heads the machine has, and how many POS terminals there are. All three are
# top of the M8 list.
# ---------------------------------------------------------------------------
stations:
  source: assumed

  # A 30-item board with customisations. `from_staffing` assumes whoever takes
  # the order also makes drinks; if the cafe runs a dedicated cashier this
  # becomes a fixed capacity and the register stops competing for barista time.
  # The trade quotes register time as a fixed transaction plus a few seconds an
  # item, which is exactly this shape.
  register:      { capacity: from_staffing, base_s: 40, per_item_s: 3,
                   source_of: { base_s: published, per_item_s: published } }

  # Hot milk only. Iced drinks never touch it, which is why the hot/iced split
  # decides how much milk batching is worth at all.
  # 12oz of milk in 12 + 13*2 = 38s, inside the 30-45s a barista is quoted for
  # a pitcher. A 32oz pitcher therefore holds two medium drinks, not four.
  # changeover_s is purging and wiping between milks. Small, and the only
  # thing a reordering policy has to work with, worth a stopwatch.
  steam_wand:    { capacity: 1, setup_s: 12, per_6oz_s: 13, changeover_s: 10,
                   batch_key: milk_type, max_batch_oz: 32,
                   source_of: { setup_s: published, per_6oz_s: published } }

  # The shot pulls on its own while the barista steams the next pitcher.
  # SCA standard extraction is 25-30s; the shot pulls while the barista steams.
  group_head:    { capacity: 2, shot_s: 27, attended: false,
                   source_of: { shot_s: published } }

  # Ice, cold milk, syrups: the iced-drink build bar.
  cold_bar:      { capacity: 2, pour_s: 12 }

  # Drip, cold brew, brewed and iced tea come off urns and taps. Nearly free.
  brew_tap:      { capacity: 4, pour_s: 10 }

  # Close the lid and walk away. A pressed sandwich occupies the press, not a
  # person, and it goes on occupying it until someone comes back for it.
  # 3-5 minutes a sandwich, one or two at a time. Run one at a time that is
  # 10-15 sandwiches an hour, which is the published throughput of a single
  # 14-inch grill and the FIFO baseline here.
  panini_press:  { capacity: 1, run_s: 240, batch_size: 2, attended: false,
                   source_of: { run_s: published, batch_size: published } }

  food_counter:  { capacity: 2, run_s: 90 }

# Which station gates capacity. Assumed, and genuinely open now: with a large
# iced share the wand may not be it. Set from measured occupancy at M8.
bottleneck_station: steam_wand

staffing:
  - { from: "07:00", to: "10:00", baristas: 2, source: assumed }
  - { from: "10:00", to: "13:00", baristas: 3, source: assumed }
  - { from: "13:00", to: "15:00", baristas: 2, source: assumed }

