# ---------------------------------------------------------------------------
# mix
#
# All assumed. `serve` is the hot/iced split, and it decides how large a share
# of the menu milk batching can touch at all, because an iced drink never goes
# near the steam wand.
#
# 20/80 stands for the warm end of the year, which is when the cafe was
# watched. It is read off cup material at the handoff shelf, where hot goes out
# in paper and cold in plastic, so the split is legible without hearing an
# order. That is a look rather than a tally, so it stays `assumed`, but it
# replaces a 45/55 that was invented, and it is the right end of the range to
# carry as the default, since it is the one the rest of this file was formed
# against.
#
# The split cannot be one number across a Madison academic year: September runs
# a 74F normal high and January a 29F one. `params/season/*.yaml` overlays this
# key per month, written by `python -m tools.serve_by_season`, which also
# documents where the two anchors come from and what would replace them.
# ---------------------------------------------------------------------------
mix:
  source: assumed
  drink:
    latte: 0.130
    vanilla_latte: 0.050
    caramel_macchiato: 0.040
    mocha: 0.035
    white_chocolate_mocha: 0.020
    cappuccino: 0.030
    americano: 0.040
    espresso: 0.010
    drip_coffee: 0.095
    cold_brew: 0.065
    cold_brew_oat_latte: 0.040
    black_tie: 0.015
    brewed_tea: 0.025
    matcha_latte: 0.030
    chai_latte: 0.025
    iced_tea: 0.040
    sparkling_grapefruit_cold_brew: 0.012
    sparkling_passion_fruit_black_tea: 0.008
    sparkling_lemonade: 0.015
    cocoa: 0.010
    bacon_egg_cheese_bagel: 0.055
    sausage_egg_cheese: 0.040
    vegan_sausage_egg_cheese: 0.020
    italian_herb_chicken: 0.030
    mona_lisa: 0.025
    monterey_turkey: 0.030
    caesar_salad: 0.020
    build_your_own_salad: 0.020
    broccoli_cheese_soup: 0.015
    chicken_dumpling_soup: 0.010

  # The board prices no alternative milk, and calories are quoted against 2%,
  # so 2% is the default and oat is a named menu item in its own right.
  milk: { two_percent: 0.30, oat: 0.32, whole: 0.12, nonfat: 0.08,
          almond: 0.10, soy: 0.08 }

  serve: { hot: 0.20, iced: 0.80 }

  # Food is an attachment, not a first choice. `item` is left out so the food
  # is drawn from the food share of `drink` above -- a salad is 110 seconds and
  # eleven dollars where a bagel is 75 and five, so turning all food into one
  # bagel distorts both the bar and the till.
  attach: { rate: 0.286, alone: 0.09 }

arrivals:
  class_blocks:
    - { ends_at: "08:50", sections: 8,  avg_enrollment: 28 }
    - { ends_at: "09:50", sections: 14, avg_enrollment: 30 }
    - { ends_at: "10:50", sections: 16, avg_enrollment: 32 }
    - { ends_at: "11:50", sections: 12, avg_enrollment: 30 }
    - { ends_at: "12:50", sections: 10, avg_enrollment: 28 }
  capture_rate: 0.055          # FITTED AT M8, primary calibration knob
  offset_min: 3.0
  sigma_min: 2.5
  background_per_hour: 8
  source: assumed

customers:
  time_budget_min:    { dist: lognormal, median: 9.0, sigma: 0.5 }
  balk_tolerance_min: { dist: lognormal, median: 7.0, sigma: 0.45 }
  # Transact mobile ordering is already deployed here, so this is an
  # observable at the pickup shelf rather than a hypothetical.
  preorder_adoption: 0.0
  # How often a held pre-order re-checks the line, and how much slack it leaves
  # when it decides. The app's release loop reads these whatever
  # `preorder_release` says; the simulator only uses them when it says adaptive.
  # Swept in params/experiments/adaptive_release.yaml: two minutes is 91% on
  # time, four is never late and almost always cold.
  release_poll_s: 30.0
  release_margin_s: 120.0
  no_show_rate: 0.03
  source: assumed

policy:
  name: fifo
  lookahead_s: 180
  reorder_window_s: 180
  starvation_guard_s: 300
  source: assumed

slots:
  enabled: false
  width_min: 5
  walkup_reserve_fraction: 0.30
  min_lead_time_min: 10
  source: assumed
